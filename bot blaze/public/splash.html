<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #fff;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .box {
        text-align: center;
      }

      .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #444;
        border-top: 4px solid #ff14ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="loader"></div>
      <div>Verificando atualizações...</div>
    </div>
  </body>
</html>
